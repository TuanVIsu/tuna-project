<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <!-- CỨU HỘ CHO IPHONE X / IOS 16 TRÁNH LỖI ITERATOR SẬP APP -->
    <script>
      (function () {
        if (typeof window.Iterator === "undefined") {
          window.Iterator = function () {};
          window.Iterator.prototype = Object.getPrototypeOf([][Symbol.iterator]());
        }
        if (typeof Promise.withResolvers === "undefined") {
          Promise.withResolvers = function () {
            var resolve, reject;
            var promise = new Promise(function (res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
      })();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#007aff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Zalo Mini App</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- built script files will be auto injected -->
    <script type="module" src="/src/app.jsx"></script>
  </body>
</html>
